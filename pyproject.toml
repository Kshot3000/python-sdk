[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "octaspace"
dynamic = ["version"]
description = "Official Python SDK for the OctaSpace API."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
  { name = "OctaSpace" },
]
keywords = ["octaspace", "sdk", "api", "gpu", "cloud", "compute"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = [
  "httpx>=0.27,<1.0",
]

[project.urls]
Homepage = "https://octa.space"
Documentation = "https://github.com/octaspace/python-sdk#readme"
Repository = "https://github.com/octaspace/python-sdk"
Issues = "https://github.com/octaspace/python-sdk/issues"
Changelog = "https://github.com/octaspace/python-sdk/blob/main/CHANGELOG.md"

[project.scripts]
octaspace-smoke = "octaspace.__main__:smoke"

[dependency-groups]
test = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "respx>=0.21",
]
playground = [
  "fastapi>=0.115",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
  "uvicorn>=0.30",
]
lint = [
  "ruff>=0.11",
]
typecheck = [
  "mypy>=1.11",
]
dev = [
  { include-group = "playground" },
  { include-group = "test" },
  { include-group = "lint" },
  { include-group = "typecheck" },
]

[tool.hatch.version]
path = "src/octaspace/__about__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/octaspace"]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--strict-markers --cov=octaspace --cov-report=term-missing"

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["octaspace"]
